<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-label="南摩會館麻將盃" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f8269"/><stop offset="1" stop-color="#0b362c"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".38"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7cf"/><stop offset=".45" stop-color="#f6d35b"/><stop offset="1" stop-color="#c9951b"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <pattern id="lat" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M24 0L48 24L24 48L0 24Z" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1.5"/></pattern>
  <filter id="ds" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".55"/></filter>
  <mask id="tm"><rect width="1200" height="400" fill="#000"/>
    <text x="600" y="238" text-anchor="middle" class="title" fill="#fff">南摩會館麻將盃</text></mask>
  <clipPath id="clip"><rect width="1200" height="400" rx="30"/></clipPath>
  <g id="tile"><rect x="-38" y="-42" width="76" height="100" rx="12" fill="#0f5a47"/>
    <rect x="-38" y="-50" width="76" height="100" rx="12" fill="#fbf5e0" stroke="#d9cfae" stroke-width="2"/></g>
</defs>
<style>
  .title{font-family:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU","Microsoft JhengHei",serif;font-weight:900;font-size:104px;letter-spacing:10px}
  .tc{font-family:"Noto Serif TC","Songti TC","PMingLiU","Microsoft JhengHei",serif;font-weight:900;font-size:56px;text-anchor:middle}
  .en{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:25px;letter-spacing:12px;fill:#f3dc8a;text-anchor:middle}
  .pill{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:700;font-size:23px;letter-spacing:2px;fill:#fff;text-anchor:middle}
  .float{animation:bob 4s ease-in-out infinite}.f2{animation-delay:-1.2s}.f3{animation-delay:-2.1s}.f4{animation-delay:-3s}
  @keyframes bob{50%{transform:translateY(-12px)}}
  .shine{animation:sweep 4.8s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-300px)}55%,100%{transform:translateX(1300px)}}
  .sp{transform-box:fill-box;transform-origin:center;opacity:.85;animation:tw 2.6s ease-in-out infinite}
  .s2{animation-delay:-.7s}.s3{animation-delay:-1.4s}.s4{animation-delay:-2s}
  @keyframes tw{0%,100%{opacity:.1;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.float,.shine,.sp{animation:none}.shine{display:none}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#lat)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
</g>
<rect x="14" y="14" width="1172" height="372" rx="22" fill="none" stroke="#e6c04a" stroke-width="4"/>
<rect x="26" y="26" width="1148" height="348" rx="16" fill="none" stroke="#e6c04a" stroke-opacity=".45" stroke-width="1.5"/>
<g fill="#e6c04a"><path d="M40 40l9 9-9 9-9-9z"/><path d="M1160 40l9 9-9 9-9-9z"/><path d="M40 360l9-9-9-9-9 9z" transform="translate(0 0)"/><path d="M1160 360l9-9-9-9-9 9z"/></g>

<!-- 麻將牌 -->
<g transform="translate(110 165) rotate(-12)"><g class="float"><use href="#tile"/><text class="tc" y="18" fill="#1a8a3c">發</text></g></g>
<g transform="translate(135 292) rotate(8)"><g class="float f2"><use href="#tile"/><text class="tc" y="18" fill="#222">東</text></g></g>
<g transform="translate(1090 165) rotate(12)"><g class="float f3"><use href="#tile"/><text class="tc" y="18" fill="#d12f2f">中</text></g></g>
<g transform="translate(1065 292) rotate(-8)"><g class="float f4"><use href="#tile"/><rect x="-22" y="-34" width="44" height="60" rx="6" fill="none" stroke="#2f6fb0" stroke-width="5"/></g></g>

<g transform="translate(0 24)">
<!-- 英文小標 -->
<g><rect x="262" y="118" width="70" height="2" fill="#f3dc8a" opacity=".8"/><rect x="868" y="118" width="70" height="2" fill="#f3dc8a" opacity=".8"/>
<text class="en" x="600" y="128">TAINAN MAJONG GAME</text></g>

<!-- 主標題 -->
<g filter="url(#ds)"><text x="600" y="238" text-anchor="middle" class="title" fill="url(#gold)" stroke="#7a5200" stroke-width="2" paint-order="stroke">南摩會館麻將盃</text></g>
<g mask="url(#tm)"><g class="shine"><polygon points="0,110 120,110 80,270 -40,270" fill="url(#shine)"/></g></g>
</g>

<!-- 閃爍星光 -->
<g fill="#fff3b0"><path class="sp" d="M300 90l5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/>
<path class="sp s2" d="M900 80l5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/>
<path class="sp s3" d="M250 330l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
<path class="sp s4" d="M960 335l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/></g>
</svg>
